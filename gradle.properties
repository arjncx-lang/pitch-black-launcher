# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# Increased from 2048m to 4096m — reduces GC pauses during compilation
org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Parallel project execution — builds independent modules simultaneously
org.gradle.parallel=true

# Configuration cache — skips Gradle config phase if nothing changed (already enabled)
org.gradle.configuration-cache=true

# R8 Optimized Resource Shrinking (AGP 8.12+ feature)
# Merges resource + code shrinking into a single R8 pipeline pass
# Can reduce APK size by up to 50% by removing resources only referenced by dead code
android.r8.optimizedResourceShrinking=true

# Kotlin code style
kotlin.code.style=official

# Enable Kotlin incremental compilation — only recompiles changed files
kotlin.incremental=true

# Use new Kotlin daemon for faster compilation
kotlin.daemon.jvm.options=-Xmx2048m